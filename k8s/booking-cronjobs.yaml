---
# A10: saqlash muddati o'tgan texnik ma'lumotlar (OTP, outbox, callback log, audit)
apiVersion: batch/v1
kind: CronJob
metadata:
  name: booking-purge-expired-data
spec:
  schedule: "30 3 * * *"          # har kuni 03:30 UTC (Toshkent 08:30 dan oldin, yuklama past)
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: purge
              image: registry.example.com/medbron/booking:${GIT_SHA}
              command: ["python", "manage.py", "purge_expired_data"]
              resources:
                requests: {cpu: "50m", memory: "128Mi"}
                limits: {cpu: "500m", memory: "256Mi"}
              envFrom:
                - secretRef: {name: booking-secrets}
                - configMapRef: {name: booking-config}

---
# E14: kunlik analitik agregat (daily_booking_agg). Dashboard xom
# `fact_booking` ni emas, shu jadvalni o'qiydi.
# Tozalashdan KEYIN ishlaydi (03:30 -> 04:15): ikkalasi ham bazaga yuk beradi.
# Job idempotent — muvaffaqiyatsiz bo'lsa keyingi yurish o'sha kunlarni
# qayta hisoblaydi, ya'ni ma'lumot yo'qolmaydi.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: booking-analytics-aggregates
spec:
  schedule: "15 4 * * *"          # har kuni 04:15 UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: aggregates
              image: registry.example.com/medbron/booking:${GIT_SHA}
              command: ["python", "manage.py", "rebuild_analytics_aggregates"]
              resources:
                requests: {cpu: "50m", memory: "128Mi"}
                limits: {cpu: "500m", memory: "512Mi"}
              envFrom:
                - secretRef: {name: booking-secrets}
                - configMapRef: {name: booking-config}

---
# B12: Click to'lovlari uchun fiskal chek (Payme chekni o'zi chiqaradi)
