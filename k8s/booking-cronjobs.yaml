# k8s/booking-cronjobs.yaml — davriy ishlar
#
# Kubernetes'siz muhitda buning o'rniga: python manage.py run_scheduler

---
# Har daqiqa: to'lanmagan bronlar EXPIRED, muddati o'tgan hold'lar FREE
apiVersion: batch/v1
kind: CronJob
metadata:
  name: booking-expire
spec:
  schedule: "* * * * *"
  concurrencyPolicy: Forbid        # oldingisi tugamagan bo'lsa yangisi boshlanmaydi
  startingDeadlineSeconds: 50
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0               # keyingi daqiqada baribir qayta ishlaydi
      activeDeadlineSeconds: 55
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: expire
              image: registry.example.com/medbron/booking:${GIT_SHA}
              command: ["python", "manage.py", "expire_bookings"]
              resources:
                requests: {cpu: "50m", memory: "128Mi"}
                limits: {cpu: "500m", memory: "256Mi"}
              envFrom:
                - secretRef: {name: booking-secrets}
                - configMapRef: {name: booking-config}

