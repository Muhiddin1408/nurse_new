# analytics-service — o'z ClickHouse + Postgres (faqat ichki tarmoqda!), admin API, ingest worker (`#` → ClickHouse).
# Outbox relay YO'Q — servis hech narsa publish qilmaydi.
# Avval: backend/infra ko'tarilgan (medbron-net, RabbitMQ) va scripts/gen-jwt-keys.sh.
#
#   cp .env.example .env && $EDITOR .env
#   docker compose up -d --build
#   docker compose --profile migrate run --rm analytics-service-migrate     # Alembic + ClickHouse sxemasi — alohida qadam
#
# Postgres/ClickHouse faqat `internal` tarmoqda: boshqa servis bu bazaga UMUMAN ulana olmaydi
# (database-per-service tarmoq darajasida). Host portlar — docs/SERVICE_REGISTRY.md.
name: analytics-service

networks:
  internal: {}
  medbron-net:
    external: true

volumes:
  postgres-data:
  clickhouse-data:

x-app: &app
  image: ${IMAGE_REPO:-medbron/analytics-service}:${IMAGE_TAG:?IMAGE_TAG (commit SHA) majburiy}
  build:
    context: ../..
    dockerfile: backend/analytics-service/Dockerfile
  init: true
  restart: unless-stopped
  env_file: .env
  environment:
    DATABASE_URL_DOCKER: postgresql://analytics_service:${POSTGRES_PASSWORD:?}@analytics-service-postgres:5432/analytics_service
    RABBITMQ_URL: amqp://${RABBITMQ_USER:?}:${RABBITMQ_PASSWORD:?}@medbron-rabbitmq:5672/
    CLICKHOUSE_URL: http://analytics-service-clickhouse:8123
  volumes:
    # Faqat PUBLIC kalitlar (read-only). Private kalit faqat imzolovchi servisga (auth/admin) ulanadi.
    - ${SECRETS_DIR:-../../secrets}/public:/secrets:ro
  networks: [internal, medbron-net]
  depends_on:
    analytics-service-postgres:
      condition: service_healthy
    analytics-service-clickhouse:
      condition: service_healthy

x-worker-healthcheck: &worker-healthcheck
  test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9100/', timeout=2)"]
  interval: 15s
  timeout: 3s
  retries: 3
  start_period: 20s

services:
  analytics-service-postgres:
    image: postgres:16-alpine
    container_name: analytics-service-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: analytics_service
      POSTGRES_USER: analytics_service
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env da majburiy}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:?}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analytics_service -d analytics_service"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks: [internal]

  analytics-service-clickhouse:
    image: clickhouse/clickhouse-server:25.8.33.6-alpine
    container_name: analytics-service-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE:-analytics}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-analytics}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD .env da majburiy}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "0"
    ulimits:
      nofile: {soft: 262144, hard: 262144}
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ports:
      - "127.0.0.1:${CLICKHOUSE_HTTP_HOST_PORT:?}:8123"
      - "127.0.0.1:${CLICKHOUSE_NATIVE_HOST_PORT:?}:9000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping | grep -q Ok"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s
    networks: [internal]

  analytics-service:
    <<: *app
    container_name: analytics-service
    ports:
      - "${HOST_PORT:?}:8080"

  analytics-service-event-consumer:
    <<: *app
    container_name: analytics-service-event-consumer
    command: ["python", "-m", "app.workers.event_consumer"]
    healthcheck: *worker-healthcheck

  analytics-service-migrate:
    <<: *app
    container_name: analytics-service-migrate
    command: ["sh", "-c", "alembic upgrade head && python -m app.cli clickhouse-migrate"]
    restart: "no"
    healthcheck:
      disable: true
    profiles: [migrate]
