# schedule-service (Go) — o'z Postgres + Redis (faqat ichki tarmoqda!), API, outbox relay, event consumer, scheduler.
# Avval: backend/infra ko'tarilgan (medbron-net, RabbitMQ) va scripts/gen-jwt-keys.sh.
#
#   cp .env.example .env && $EDITOR .env
#   docker compose up -d --build
#   docker compose --profile migrate run --rm schedule-service-migrate     # migratsiya — alohida qadam
name: schedule-service

networks:
  internal: {}
  medbron-net:
    external: true

volumes:
  postgres-data:
  redis-data:

x-app: &app
  image: ${IMAGE_REPO:-medbron/schedule-service}:${IMAGE_TAG:?IMAGE_TAG (commit SHA) majburiy}
  build:
    context: ../..
    dockerfile: backend/schedule-service/Dockerfile
  init: true
  restart: unless-stopped
  env_file: .env
  environment:
    DATABASE_URL_DOCKER: postgres://schedule_service:${POSTGRES_PASSWORD:?}@schedule-service-postgres:5432/schedule_service?sslmode=disable
    REDIS_URL: redis://:${REDIS_PASSWORD:?}@schedule-service-redis:6379/0
    RABBITMQ_URL: amqp://${RABBITMQ_USER:?}:${RABBITMQ_PASSWORD:?}@medbron-rabbitmq:5672/
  volumes:
    - ${SECRETS_DIR:-../../secrets}/public:/secrets:ro
  networks: [internal, medbron-net]
  depends_on:
    schedule-service-postgres:
      condition: service_healthy
    schedule-service-redis:
      condition: service_healthy

x-worker-healthcheck: &worker-healthcheck
  test: ["CMD", "/usr/local/bin/healthcheck", "http://127.0.0.1:9100/"]
  interval: 15s
  timeout: 3s
  retries: 3
  start_period: 10s

services:
  schedule-service-postgres:
    image: postgres:16-alpine
    container_name: schedule-service-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: schedule_service
      POSTGRES_USER: schedule_service
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env da majburiy}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:?}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schedule_service -d schedule_service"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks: [internal]

  schedule-service-redis:
    image: redis:7.4-alpine
    container_name: schedule-service-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD .env da majburiy}", "--appendonly", "yes"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:?}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks: [internal]

  schedule-service:
    <<: *app
    container_name: schedule-service
    ports:
      - "${HOST_PORT:?}:8080"

  schedule-service-outbox-relay:
    <<: *app
    container_name: schedule-service-outbox-relay
    command: ["/usr/local/bin/schedule-relay"]
    healthcheck: *worker-healthcheck

  schedule-service-event-consumer:
    <<: *app
    container_name: schedule-service-event-consumer
    command: ["/usr/local/bin/schedule-consumer"]
    healthcheck: *worker-healthcheck

  # Davriy vazifalar: slot generatsiyasi (02:00 Toshkent), hold expiry (har daqiqa), 90 kunlik tozalash.
  # Bir nechta nusxa xavfsiz (generatsiya — advisory lock, expiry — SKIP LOCKED), lekin bittasi yetarli.
  schedule-service-scheduler:
    <<: *app
    container_name: schedule-service-scheduler
    command: ["/usr/local/bin/schedule-scheduler"]
    healthcheck: *worker-healthcheck

  schedule-service-migrate:
    image: migrate/migrate:v4.18.1
    container_name: schedule-service-migrate
    restart: "no"
    volumes:
      - ./migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://schedule_service:${POSTGRES_PASSWORD:?}@schedule-service-postgres:5432/schedule_service?sslmode=disable
      - up
    depends_on:
      schedule-service-postgres:
        condition: service_healthy
    networks: [internal]
    profiles: [migrate]
