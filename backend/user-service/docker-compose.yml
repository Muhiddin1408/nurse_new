# user-service — o'z Postgres + Redis (faqat ichki tarmoqda!), API, outbox relay, event consumer.
# Avval: backend/infra ko'tarilgan (medbron-net, RabbitMQ) va scripts/gen-jwt-keys.sh.
#
#   cp .env.example .env && $EDITOR .env
#   docker compose up -d --build
#   docker compose --profile migrate run --rm user-service-migrate     # migratsiya — alohida qadam
#
# Postgres/Redis faqat `internal` tarmoqda: boshqa servis bu bazaga UMUMAN ulana olmaydi
# (database-per-service tarmoq darajasida). Host portlar — docs/SERVICE_REGISTRY.md.
name: user-service

networks:
  internal: {}
  medbron-net:
    external: true

volumes:
  postgres-data:
  redis-data:

x-app: &app
  image: ${IMAGE_REPO:-medbron/user-service}:${IMAGE_TAG:?IMAGE_TAG (commit SHA) majburiy}
  build:
    context: ../..
    dockerfile: backend/user-service/Dockerfile
  init: true
  restart: unless-stopped
  env_file: .env
  environment:
    DATABASE_URL_DOCKER: postgresql://user_service:${POSTGRES_PASSWORD:?}@user-service-postgres:5432/user_service
    REDIS_URL: redis://:${REDIS_PASSWORD:?}@user-service-redis:6379/0
    RABBITMQ_URL: amqp://${RABBITMQ_USER:?}:${RABBITMQ_PASSWORD:?}@medbron-rabbitmq:5672/
  volumes:
    # Faqat PUBLIC kalitlar (read-only). Private kalit faqat imzolovchi servisga (auth/admin) ulanadi.
    - ${SECRETS_DIR:-../../secrets}/public:/secrets:ro
  networks: [internal, medbron-net]
  depends_on:
    user-service-postgres:
      condition: service_healthy
    user-service-redis:
      condition: service_healthy

x-worker-healthcheck: &worker-healthcheck
  test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9100/', timeout=2)"]
  interval: 15s
  timeout: 3s
  retries: 3
  start_period: 20s

services:
  user-service-postgres:
    image: postgres:16-alpine
    container_name: user-service-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: user_service
      POSTGRES_USER: user_service
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env da majburiy}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:?}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_service -d user_service"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks: [internal]

  user-service-redis:
    image: redis:7.4-alpine
    container_name: user-service-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD .env da majburiy}", "--appendonly", "yes"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:?}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks: [internal]

  user-service:
    <<: *app
    container_name: user-service
    ports:
      - "${HOST_PORT:?}:8080"

  user-service-outbox-relay:
    <<: *app
    container_name: user-service-outbox-relay
    command: ["python", "-m", "app.workers.outbox_relay"]
    healthcheck: *worker-healthcheck

  user-service-event-consumer:
    <<: *app
    container_name: user-service-event-consumer
    command: ["python", "-m", "app.workers.event_consumer"]
    healthcheck: *worker-healthcheck

  user-service-migrate:
    <<: *app
    container_name: user-service-migrate
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    healthcheck:
      disable: true
    profiles: [migrate]
