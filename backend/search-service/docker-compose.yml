# search-service — o'z Postgres + Redis + Elasticsearch 8 (faqat ichki tarmoqda!), API, event consumer (proyeksiya → ES),
# scheduler (reindex navbati, mutaxassisliklar lug'ati). Hech narsa publish qilmaydi — outbox relay yo'q.
# Avval: backend/infra ko'tarilgan (medbron-net, RabbitMQ) va scripts/gen-jwt-keys.sh.
#
#   cp .env.example .env && $EDITOR .env
#   docker compose up -d --build
#   docker compose --profile migrate run --rm search-service-migrate     # migratsiya — alohida qadam
#
# Postgres/Redis faqat `internal` tarmoqda: boshqa servis bu bazaga UMUMAN ulana olmaydi
# (database-per-service tarmoq darajasida). Host portlar — docs/SERVICE_REGISTRY.md.
name: search-service

networks:
  internal: {}
  medbron-net:
    external: true

volumes:
  postgres-data:
  redis-data:
  es-data:

x-app: &app
  image: ${IMAGE_REPO:-medbron/search-service}:${IMAGE_TAG:?IMAGE_TAG (commit SHA) majburiy}
  build:
    context: ../..
    dockerfile: backend/search-service/Dockerfile
  init: true
  restart: unless-stopped
  env_file: .env
  environment:
    DATABASE_URL_DOCKER: postgresql://search_service:${POSTGRES_PASSWORD:?}@search-service-postgres:5432/search_service
    REDIS_URL: redis://:${REDIS_PASSWORD:?}@search-service-redis:6379/0
    ELASTICSEARCH_URL: http://search-service-elasticsearch:9200
    RABBITMQ_URL: amqp://${RABBITMQ_USER:?}:${RABBITMQ_PASSWORD:?}@medbron-rabbitmq:5672/
  volumes:
    # Faqat PUBLIC kalitlar (read-only). Private kalit faqat imzolovchi servisga (auth/admin) ulanadi.
    - ${SECRETS_DIR:-../../secrets}/public:/secrets:ro
  networks: [internal, medbron-net]
  depends_on:
    search-service-postgres:
      condition: service_healthy
    search-service-redis:
      condition: service_healthy
    search-service-elasticsearch:
      condition: service_healthy

x-worker-healthcheck: &worker-healthcheck
  test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9100/', timeout=2)"]
  interval: 15s
  timeout: 3s
  retries: 3
  start_period: 20s

services:
  search-service-postgres:
    image: postgres:16-alpine
    container_name: search-service-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: search_service
      POSTGRES_USER: search_service
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env da majburiy}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:?}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U search_service -d search_service"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks: [internal]

  search-service-redis:
    image: redis:7.4-alpine
    container_name: search-service-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD .env da majburiy}", "--appendonly", "yes"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:?}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks: [internal]

  # Elasticsearch 8 (2026-10-21 qarori) — FAQAT shu servis (database-per-service); host'ga faqat 127.0.0.1.
  # DEV: bitta tugun, xavfsizlik o'chiq (tarmoq — ichki). PROD: xpack.security yoqiladi, ELASTICSEARCH_USERNAME/PASSWORD.
  search-service-elasticsearch:
    image: elasticsearch:8.19.3  # Docker Hub rasmiy image (Elastic chiqaradi); docker.elastic.co bilan bir xil
    container_name: search-service-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.ml.enabled: "false"
      ES_JAVA_OPTS: ${ES_JAVA_OPTS:--Xms512m -Xmx512m}
      cluster.routing.allocation.disk.threshold_enabled: "false"
    ulimits:
      memlock: {soft: -1, hard: -1}
    volumes:
      - es-data:/usr/share/elasticsearch/data
    ports:
      - "127.0.0.1:${ES_HOST_PORT:-9200}:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=2s' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks: [internal]

  search-service:
    <<: *app
    container_name: search-service
    ports:
      - "${HOST_PORT:?}:8080"


  search-service-event-consumer:
    <<: *app
    container_name: search-service-event-consumer
    command: ["python", "-m", "app.workers.event_consumer"]
    healthcheck: *worker-healthcheck

  search-service-scheduler:
    <<: *app
    container_name: search-service-scheduler
    command: ["python", "-m", "app.workers.scheduler"]
    healthcheck: *worker-healthcheck

  search-service-migrate:
    <<: *app
    container_name: search-service-migrate
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    healthcheck:
      disable: true
    profiles: [migrate]
