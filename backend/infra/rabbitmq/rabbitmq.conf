# Standart guest foydalanuvchisi YO'Q — login .env dagi RABBITMQ_USER/RABBITMQ_PASSWORD (BLUEPRINT 11).
loopback_users.guest = true
# Quorum navbatlar uchun: xabar cheksiz qayta yetkazilib aylanib qolmasin (zahira chegara;
# asosiy retry/DLQ mantiqi consumer'da).
default_queue_type = quorum
# Disk tugashidan oldin publisher'lar to'xtatiladi (xabar yo'qolmaydi).
disk_free_limit.absolute = 2GB
vm_memory_high_watermark.relative = 0.6
prometheus.return_per_object_metrics = false
