# file-service — o'z Postgres (+ Redis, reestrda bo'lsa; faqat ichki tarmoqda!), API, outbox relay, event consumer.
# Avval: backend/infra ko'tarilgan (medbron-net, RabbitMQ) va scripts/gen-jwt-keys.sh.
#
#   cp .env.example .env && $EDITOR .env
#   docker compose up -d --build
#   docker compose --profile migrate run --rm file-service-migrate     # migratsiya — alohida qadam
#
# Postgres/Redis faqat `internal` tarmoqda: boshqa servis bu bazaga UMUMAN ulana olmaydi
# (database-per-service tarmoq darajasida). Host portlar — docs/SERVICE_REGISTRY.md.
name: file-service

networks:
  internal: {}
  medbron-net:
    external: true

volumes:
  postgres-data:

x-app: &app
  image: ${IMAGE_REPO:-medbron/file-service}:${IMAGE_TAG:?IMAGE_TAG (commit SHA) majburiy}
  build:
    context: ../..
    dockerfile: backend/file-service/Dockerfile
  init: true
  restart: unless-stopped
  env_file: .env
  environment:
    DATABASE_URL_DOCKER: postgresql://file_service:${POSTGRES_PASSWORD:?}@file-service-postgres:5432/file_service
    RABBITMQ_URL: amqp://${RABBITMQ_USER:?}:${RABBITMQ_PASSWORD:?}@medbron-rabbitmq:5672/
  volumes:
    # Faqat PUBLIC kalitlar (read-only). Private kalit faqat imzolovchi servisga (auth/admin) ulanadi.
    - ${SECRETS_DIR:-../../secrets}/public:/secrets:ro
  networks: [internal, medbron-net]
  depends_on:
    file-service-postgres:
      condition: service_healthy

x-worker-healthcheck: &worker-healthcheck
  test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9100/', timeout=2)"]
  interval: 15s
  timeout: 3s
  retries: 3
  start_period: 20s

services:
  file-service-postgres:
    image: postgres:16-alpine
    container_name: file-service-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: file_service
      POSTGRES_USER: file_service
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env da majburiy}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:?}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U file_service -d file_service"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks: [internal]


  file-service:
    <<: *app
    container_name: file-service
    ports:
      - "${HOST_PORT:?}:8080"

  file-service-outbox-relay:
    <<: *app
    container_name: file-service-outbox-relay
    command: ["python", "-m", "app.workers.outbox_relay"]
    healthcheck: *worker-healthcheck


  file-service-scheduler:
    <<: *app
    container_name: file-service-scheduler
    command: ["python", "-m", "app.workers.scheduler"]
    healthcheck: *worker-healthcheck

  file-service-migrate:
    <<: *app
    container_name: file-service-migrate
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    healthcheck:
      disable: true
    profiles: [migrate]
