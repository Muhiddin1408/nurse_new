[project]
name = "pricing-service"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
# Versiyalar QAT'IY (BLUEPRINT 5.1). Umumiy bog'liqliklar (fastapi, sqlalchemy, ...) medbron-common
# orqali keladi — bu yerga faqat servisga xos paketlar qo'shiladi.
dependencies = [
    "medbron-common==0.1.0",
    "uvicorn[standard]==0.54.0",
    "alembic==1.20.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "testcontainers==4.15.0",
    "ruff==0.17.1",
    "mypy==2.4.0",
]

[tool.uv]
package = false

[tool.uv.sources]
medbron-common = { path = "../../libs/py-common", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = ["integration: Docker (testcontainers) talab qiladi"]
addopts = "-ra"

[tool.coverage.run]
source = ["app"]
concurrency = ["thread", "greenlet"]

[tool.coverage.report]
fail_under = 70

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S", "RUF"]
ignore = ["S101", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
section-order = ["future", "standard-library", "third-party", "medbron", "first-party", "local-folder"]

[tool.ruff.lint.isort.sections]
medbron = ["medbron_common"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
"migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["tests/", "migrations/"]

[[tool.mypy.overrides]]
module = ["testcontainers.*"]
ignore_missing_imports = true
