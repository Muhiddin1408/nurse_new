[pytest]
DJANGO_SETTINGS_MODULE = conf.settings
python_files = tests.py test_*.py *_tests.py

# -q — chiqishni qisqartiradi; testlar nomi o'zbekcha va uzun, shuning uchun
# to'liq ro'yxat kerak bo'lganda `-v` bilan ishga tushiring.
addopts = -q --strict-markers

markers =
    payme_sandbox: Payme Merchant API kontrakt testlari (B2). CI'da: pytest -m payme_sandbox
