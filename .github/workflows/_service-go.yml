# Qayta ishlatiladigan pipeline — Go servis: lint → test → contracts-check → build → migrate → deploy.
name: _service-go

on:
  workflow_call:
    inputs:
      service: {type: string, required: true}

permissions:
  contents: read
  packages: write

jobs:
  lint:
    runs-on: ubuntu-24.04
    defaults: {run: {working-directory: "backend/${{ inputs.service }}"}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: "1.26", cache-dependency-path: "backend/${{ inputs.service }}/go.sum"}
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0 && golangci-lint run ./...

  test:
    runs-on: ubuntu-24.04
    defaults: {run: {working-directory: "backend/${{ inputs.service }}"}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: "1.26", cache-dependency-path: "backend/${{ inputs.service }}/go.sum"}
      - name: Unit + integratsiya, coverage ≥ 70%
        run: |
          go test -tags integration -count=1 -coverprofile=coverage.out ./...
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {sub("%","",$3); print $3}')
          echo "coverage: ${total}%"
          awk -v t="$total" 'BEGIN { exit (t < 70) }'

  contracts-check:
    uses: ./.github/workflows/_contracts.yml

  build:
    needs: [lint, test, contracts-check]
    uses: ./.github/workflows/_build-deploy.yml
    with:
      service: ${{ inputs.service }}
    secrets: inherit
