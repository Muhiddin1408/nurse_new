# build (tag = commit SHA, `latest` yo'q) → migrate → deploy.
#   dev  branch → `dev` environment (avtomatik)
#   main branch → `prod` environment (GitHub environment protection: qo'lda tasdiqlash)
# Serverda: /opt/medbron/<servis>/{docker-compose.yml,.env} va /opt/medbron/secrets — CI ularga TEGMAYDI.
name: _build-deploy

on:
  workflow_call:
    inputs:
      service: {type: string, required: true}
      # <servis>-migrate compose profili (alembic / golang-migrate) — up'dan OLDIN alohida qadam
      migrate: {type: boolean, default: true}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/medbron-${{ inputs.service }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/${{ inputs.service }}/Dockerfile
          push: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main') }}
          tags: ${{ steps.meta.outputs.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ inputs.service }}
          cache-to: type=gha,mode=max,scope=${{ inputs.service }}

  deploy:
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    environment: ${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}
    concurrency:
      group: deploy-${{ inputs.service }}-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: SSH kalit
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: migrate → deploy → health
        env:
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
        run: |
          scp scripts/deploy-service.sh "$TARGET:/tmp/deploy-service-${{ github.sha }}.sh"
          ssh "$TARGET" bash /tmp/deploy-service-${{ github.sha }}.sh \
            "${{ inputs.service }}" "${{ needs.build.outputs.image }}" "${{ github.sha }}" "${{ inputs.migrate && 'migrate' || 'none' }}"
